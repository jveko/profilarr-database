  id: 1
  input: "Movie.2024.720p.AMZN.WEB-DL.DD5.1.H.264-NTb"
- expected: false
  id: 2
  input: "Movie.2024.1080p.AMZN.WEB-DL.DD5.1.H.264-NTb"
- expected: false
  id: 3
  input: "Movie.2024.720p.AMZN.WEBRip.x265.H.264-GROUP"