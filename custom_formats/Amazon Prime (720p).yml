name: Amazon Prime [720p]
description: Matches 720p 'Amazon Prime' WEB-DLs, optimized for 720p streaming profiles
tags:
- Streaming Service
- WEB-DL
conditions:
- name: 720p
  negate: false
  required: true
  resolution: 720p
  type: resolution
- name: AMZN Regex
  negate: false
  pattern: Amazon Prime
  required: true
