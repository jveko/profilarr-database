name: 720p Streaming
description: 'Optimized for Zurg + rclone + Jellyfin streaming workflows. Prioritizes 720p content with minimal file sizes for efficient bandwidth usage and fast streaming startup. Targets WEB-DL sources for best quality-to-size ratio with codec compatibility for direct play in Jellyfin.

- Primary target: 720p WEB-DL from major streaming services
- Secondary: Efficient x265 encodes for smallest file sizes  
- Compatibility: x264 fallback for older devices
- Fallback: SD content when 720p unavailable
- Audio: Prioritizes lossy codecs (AAC, DD) for streaming efficiency'
tags:
- 720p
- Streaming
- Bandwidth Optimized
- Direct Play
- WEB-DL
