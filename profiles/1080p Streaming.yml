name: 1080p Streaming
description: 'Optimized for Zurg + rclone + Jellyfin streaming workflows. Prioritizes 1080p content with balanced file sizes for efficient bandwidth usage while maintaining high quality. Enhanced with resolution-specific streaming service formats and codec efficiency.

- Primary target: 1080p WEB-DL from major streaming services (Netflix, Amazon Prime, Disney+)
- Codec priority: h265/HEVC > x265 > x264 (streaming-compatible) for efficiency vs compatibility balance
- Audio priority: AAC > Dolby Digital+ > Dolby Digital for streaming efficiency  
- Resolution strategy: 1080p primary, 720p fallback, SD emergency fallback
- Quality tiers: Includes streaming-optimized encodes (Balanced Tiers) over transparency-focused ones
- Future-ready: Limited AV1 support for emerging codec adoption'
tags:
